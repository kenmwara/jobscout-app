# A backup that is PROVEN, daily.
#
# An export nobody has restored is not a backup, so this does not stop at the
# export: it loads the dump into an empty database and compares the row counts
# table by table against the live one. A difference fails the run.
#
# The dump leaves Cloudflare and is kept as a build artifact, so a loss of the
# account does not take the only copy with it.
#
# NEEDS ONE REPOSITORY SECRET: CLOUDFLARE_API_TOKEN, with D1 read on the
# account that owns the `jobscout-app` database. Settings → Secrets → Actions.
# Without it the run fails loudly rather than passing on an empty export.
name: backup

on:
  schedule:
    - cron: "17 2 * * *"      # 02:17 UTC daily, off the hour so it does not queue behind everyone
  workflow_dispatch:           # and on demand, which is how a restore gets rehearsed

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned and installed, not fetched by npx at run time: a bare npx prompts
      # before downloading, and a prompt in CI is a hang.
      - name: wrangler
        run: npm install -g wrangler@4.95.0

      - name: The token is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it in Settings > Secrets > Actions, with D1 read on the account that owns the jobscout-app database. Until then there is NO backup of the run history and the sweep feed."
            exit 1
          fi

      - name: Export, restore into an empty database, and compare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2e6bc4972886886c791bf361387b051d
        run: python tools/backup_check.py jobscout-app --out "$GITHUB_WORKSPACE/backups"

      - name: Keep the dump off Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: jobscout-app-d1-${{ github.run_number }}
          path: backups/*.sql
          retention-days: 90
          if-no-files-found: error

      # BACKUP MONITORING (2026-09-24). Every run, pass or fail, leaves a heartbeat in the private
      # kenmwara/backup-heartbeats repo; the T BOT droplet's Morning Verify reads it daily, so a job that
      # stops running at all (GitHub disables schedules on quiet repos) is caught, not just one that fails.
      # A failed run also pings the ops Telegram at once.
      - name: Heartbeat, and Telegram on failure
        if: always()
        env:
          HB_KEY: ${{ secrets.HEARTBEAT_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          NAME: jobscout
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATUS" != "success" ] && [ -n "$TG_TOKEN" ]; then
            curl -s -o /dev/null -w "telegram HTTP %{http_code}\n" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=🚨 ${NAME} backup: ${STATUS}. There is no fresh, proven copy until this is fixed. ${RUN}"
          fi
          if [ -z "$HB_KEY" ]; then echo "::warning::HEARTBEAT_KEY missing, no heartbeat written"; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$HB_KEY" > ~/.ssh/hb && chmod 600 ~/.ssh/hb
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/hb -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          OK=false; [ "$STATUS" = "success" ] && OK=true
          for i in 1 2 3 4; do
            rm -rf hb
            if ! git clone -q --depth 1 git@github.com:kenmwara/backup-heartbeats.git hb 2>/dev/null; then
              mkdir hb && git -C hb init -q -b main && git -C hb remote add origin git@github.com:kenmwara/backup-heartbeats.git
            fi
            printf '{"name": "%s", "ok": %s, "status": "%s", "ts": "%s", "run": "%s"}\n' \
              "$NAME" "$OK" "$STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN" > "hb/$NAME.json"
            git -C hb add -A
            git -C hb -c user.name=backup-heartbeat -c user.email=hb@tbot.trade commit -qm "$NAME: $STATUS"
            if git -C hb push -q origin HEAD:main; then echo "heartbeat written: $NAME $STATUS"; break; fi
            sleep $((i * 4))
          done
          rm -f ~/.ssh/hb
