# DO THE CHECKS STILL BITE?
#
# `sanity.mjs` on every push proves the product is right. This proves the
# CHECKS are right, which is a different question and the one that went
# unasked: on 2026-09-22 four real defects were live while the suite was green,
# because each check measured the thing it was written for and was blind to the
# thing that broke.
#
# `--mutations` breaks the code on purpose, once per named mutation, and
# requires the check to go red. A check that passes its own mutation has
# quietly stopped testing anything. That is slow — dozens of browser runs — so
# it is nightly rather than per-push, and a check that has gone to sleep is
# found within a day instead of never.
name: checks nightly

on:
  schedule:
    - cron: "41 3 * * *"       # 03:41 UTC, after the backup and off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Serve the repository
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/site/index.html && break; sleep 1; done

      # Exit 2 is the one that matters: a check that did NOT notice its own
      # mutation. sanity.mjs reports it as "asleep" rather than as a pass.
      - name: Every check is still awake
        run: node tools/sanity.mjs --mutations
