# Push-to-deploy for the Pages site.
#
# jobscout-app is a DIRECT-UPLOAD Pages project and Cloudflare cannot convert one
# to a Git-connected project ("If you choose Direct Upload, you cannot switch to
# Git integration later"). Going Git-connected would mean a NEW project, which
# would take a different .pages.dev subdomain and force re-pointing
# www.jobscout.tbot.trade. So this runs the same wrangler command by hand instead
# - same project, same domains, same deploy mechanism, just triggered by a push.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN
#   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#   -> "Edit Cloudflare Workers" template, or a custom token with
#      Account | Cloudflare Pages | Edit   (account: 2e6bc4972886886c791bf361387b051d)
#   then GitHub -> repo Settings -> Secrets and variables -> Actions -> New secret.
# The account id below is not a secret; the token is the only thing that is.

name: deploy site

on:
  push:
    branches: [main]
    # tools/** and docs/specs.json are IN the filter on purpose: a change to a
    # CHECK, or to the ledger of what the checks must prove, has to re-run the
    # gate. Without them the first fix to a check did not re-run the suite,
    # which is the gate failing to cover itself.
    paths: ['site/**', 'worker/**', 'tokens/**', 'tools/**', 'docs/specs.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # THE GATE. Until 2026-09-22 this repository had 41 check tools, 19 of them
  # re-provable on demand, and continuous integration ran exactly one of them:
  # the token generator below. The suite was a habit, not a gate — which is how
  # four real defects shipped while every check anyone happened to run was
  # green. Nothing deploys now unless the suite passes.
  #
  # `sanity.mjs` runs the checks. `--mutations` proves the checks still BITE and
  # is slower, so it runs nightly in checks-nightly.yml rather than on every
  # push; a check that has quietly stopped testing anything is caught within a
  # day instead of never.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Several checks open the site over HTTP rather than from the file system,
      # because a file:// origin has no service worker and no fetch to the API.
      - name: Serve the repository
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/site/index.html && break; sleep 1; done

      - name: The generated tokens match tokens.json
        run: node tokens/generate.mjs --check

      - name: The suite
        run: node tools/sanity.mjs

      - name: Every requirement still has the check that proves it
        run: python tools/specs.py --check

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2e6bc4972886886c791bf361387b051d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set - add it in repo Settings > Secrets > Actions."
            exit 1
          fi
          # Stamp the stylesheet's content hash into every reference to it.
          #
          # WHY. Pages serves HTML at max-age=0 and other assets at 14400, and
          # on the custom domain a _headers rule that LOWERS base.css is
          # ignored - while the same file's rule RAISING fonts-embedded.css is
          # honoured, and both are honoured on *.pages.dev. So it is the zone,
          # which this workflow cannot reach. The result was new HTML paired
          # with a four-hour-old palette: the toggle set data-theme="system",
          # the cached CSS had no rule for it, and nothing repainted until a
          # hard reset. Reported exactly that way.
          #
          # A content hash makes the URL change whenever the file does, so no
          # cache policy anywhere can pair new markup with an old palette. The
          # checkout is fresh, so this never touches the repo.
          for css in tokens.css base.css field.css; do
            H=$(md5sum "site/$css" | cut -c1-10)
            sed -i "s|href=\"$css\"|href=\"$css?v=$H\"|g" site/*.html
            echo "$css pinned to $H"
          done
          grep -ho 'href="[a-z]*\.css[^"]*"' site/*.html | sort -u
          # The same for the shared scripts (motion v2): rose.js builds the
          # rose on every page and hsheet.js is the phone header. Pages
          # caches a .js for four hours, so a reader got new HTML with the
          # OLD rose builder - "it is still loading a stale version".
          for js in band.js evidence.js rose.js hsheet.js parallax.js field.js; do
            H=$(md5sum "site/$js" | cut -c1-10)
            sed -i "s|src=\"$js\"|src=\"$js?v=$H\"|g" site/*.html
            echo "$js pinned to $H"
          done
          grep -ho 'src="[a-z]*\.js[^"]*"' site/*.html | sort -u
          # And the build itself, visible in the footer: commit + UTC time.
          sed -i "s|<meta name=\"build\" content=\"dev\">|<meta name=\"build\" content=\"${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)\">|" site/*.html
          grep -ho '<meta name="build"[^>]*>' site/index.html

          npx --yes wrangler@4.95.0 pages deploy site \
            --project-name jobscout-app \
            --branch main \
            --commit-dirty=true

  # The API worker deploys the same way and with the same token. If the token was minted from
  # the Pages-only template this job fails and the site job does not, which is the right
  # failure: the page's counters are fire-and-forget, so an old worker just drops them.
  worker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker/ to Cloudflare Workers
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2e6bc4972886886c791bf361387b051d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set - add it in repo Settings > Secrets > Actions."
            exit 1
          fi
          npm install --no-audit --no-fund
          npx --yes wrangler@4.95.0 deploy
