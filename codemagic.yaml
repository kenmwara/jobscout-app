# JobScout native builds — Codemagic CI.
# android-debug: installable debug APK (no signing setup needed).
# ios-simulator: proves the SwiftUI app compiles + links; device/TestFlight
#   distribution waits on an Apple Developer account.
#
# AUTO-TRIGGERING (added 2026-09-10). Both build workflows start on a push to
# main, but only when that push touched their own platform — `triggering` picks
# the event, `when.changeset` decides whether it actually runs. The two are
# PARALLEL workflow-level keys; `when` is not nested inside `triggering`.
#
# Why path-scoped: the free plan has finite minutes and mac_mini_m2 is the only
# instance type available, so both workflows queue behind the same machine. A
# site-only or brand-kit commit must not spend a build slot.
#
# Two things that will look like bugs and are not:
#   1. codemagic.yaml is ALWAYS in the changeset, so editing THIS file triggers
#      everything. That is Codemagic's behaviour, not a mistake in the patterns.
#   2. The first push after adding a changeset builds regardless of the
#      condition; filtering starts from the build after that one.
#
# android-screens stays MANUAL on purpose — it boots an emulator and drives the
# whole pipeline for portfolio screenshots, which is far too expensive to run on
# every commit.
workflows:
  android-debug:
    name: JobScout Android (debug APK)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'android/'
        excludes:
          - '**/*.md'
    # linux_x2, not mac_mini_m2: nothing here needs a Mac. Gradle, the Android SDK and the
    # keystore signing all run on Linux, and Linux is $0.045/min against macOS at $0.095 —
    # 67% of this account's build minutes were Android on a Mac for no reason. NEEDS BILLING
    # ENABLED: linux_x2 is refused on the free personal plan.
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd android
          bash ../tools/gradle.sh assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JobScout-debug.apk
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  # Store build: a signed AAB for Google Play plus a signed APK for the GitHub
  # Release, both under the same upload key so the key fingerprint registered
  # with Android developer verification covers every copy in the wild and an
  # installed APK updates in place instead of demanding an uninstall.
  #
  # Runs on a `v*` tag, never on plain pushes — a release is a decision.
  # Needs ONE thing set in the Codemagic UI: Team settings → Code signing
  # identities → Android keystores → the existing reference
  # `tbot_keystore` (the one T BOT already uses — Play allows one upload key
  # across apps, and one key is one backup). Codemagic then exports CM_KEYSTORE_PATH/_PASSWORD,
  # CM_KEY_ALIAS/_PASSWORD, which app/build.gradle.kts reads.
  android-release:
    name: JobScout Android (signed AAB + APK)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    # linux_x2, not mac_mini_m2: nothing here needs a Mac. Gradle, the Android SDK and the
    # keystore signing all run on Linux, and Linux is $0.045/min against macOS at $0.095 —
    # 67% of this account's build minutes were Android on a Mac for no reason. NEEDS BILLING
    # ENABLED: linux_x2 is refused on the free personal plan.
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - tbot_keystore
    scripts:
      - name: The Play credentials are present
        script: |
          # Fail BEFORE the build, not after it. Without this a missing key
          # gives a green build with artefacts and no release - which is
          # indistinguishable, from the outside, from a release that worked.
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is not set."
            echo "Codemagic > this app > Environment variables: paste the Google Play"
            echo "service account JSON, mark it Secure. Until then a tag builds a"
            echo "bundle and nothing reaches the Alpha track."
            exit 1
          fi
      - name: Build signed release
        script: |
          cd android
          bash ../tools/gradle.sh bundleRelease assembleRelease
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/JobScout-$BUILD_NUMBER.aab"
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/JobScout-release.apk
          # The fingerprint to paste into Play Console → Android developer verification.
          # apksigner, not keytool: with minSdk 26 the APK carries only a v2/v3
          # signature block, and `keytool -printcert -jarfile` sees no JAR
          # signature at all (that is what failed build #1 after a green Gradle).
          # Never fatal — the artifacts are the point; the file says what happened.
          BT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/JobScout-release.apk \
            > app/build/outputs/apk/release/signing-fingerprints.txt 2>&1 || true
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/release/signing-fingerprints.txt

    # ------------------------------------------------------------------
    # PUT IT ON THE TRACK. Added 2026-09-23, and the reason is a mistake:
    # this workflow had NO publishing block, so a tag produced a signed
    # bundle and stopped. The step Codemagic calls "Publishing" publishes
    # ARTEFACTS to the build page, and reading that step name as a release
    # is how 0.9.7 came to be reported as live on the Alpha track while
    # Play Console's Submission activity had never heard of it. Every
    # release before this one reached Play because a human uploaded the
    # .aab by hand.
    #
    # NEEDS ONE SECURE ENVIRONMENT VARIABLE in Codemagic:
    #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS - the Google Play service
    #   account JSON, pasted whole, marked Secure.
    # The service account needs "Release apps to testing tracks" in Play
    # Console under Users and permissions. It does NOT need production.
    #
    # Play refuses an API upload for an app that has never been uploaded by
    # hand, and refuses any versionCode not higher than the last. The first
    # is already satisfied; the second is why versionCode is BUILD_NUMBER,
    # which only ever goes up.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # alpha IS the closed testing track. internal is a different, smaller
        # one, and beta is open testing - neither is where these testers are.
        track: alpha
        # A draft sits in the console waiting for someone to notice it, which
        # is the failure this block exists to end.
        submit_as_draft: false
        # false = the release IS sent for review, which is what makes it
        # reach a tester rather than sit in review limbo.
        changes_not_sent_for_review: false

  # Portfolio screenshots: build, install on an emulator, drive the real
  # pipeline once, capture each stage (tools/native_screens.sh).
  #
  # ⛔ THIS CANNOT RUN ON THE FREE PLAN. Proved 2026-09-11, twice. The Android
  # emulator needs Hypervisor.framework for acceleration on Apple Silicon, and
  # the build itself runs inside a VM on mac_mini_m2, so nested virtualisation
  # is unavailable and QEMU dies on startup:
  #
  #     HVF error: HV_UNSUPPORTED
  #     qemu-system-aarch64-headless: failed to initialize HVF: Invalid argument
  #
  # No timeout or flag fixes this. `-accel off` would fall back to pure software
  # emulation, which will not boot and drive a live pipeline inside any sane cap.
  # The real fix is a Linux instance with KVM, and the free plan offers only
  # mac_mini_m2 (linux_x2 returns a billing-plan error).
  #
  # Until then, native screenshots come from a REAL PHONE — which is a better
  # caption anyway. Do not start this workflow expecting images; it will build a
  # fine APK and then fail at the emulator step.
  android-screens:
    name: JobScout Android (UI screenshots)
    # linux_x2 is the only instance that can run this at all: the emulator needs KVM, and
    # mac_mini_m2 is itself a VM that cannot nest virtualisation — on it the emulator dies at
    # boot with `HVF error: HV_UNSUPPORTED` and the build yields nothing but an emulator.log.
    # NEEDS BILLING ENABLED, like the other two Android workflows.
    instance_type: linux_x2
    # 30 was not enough: the APK build alone takes ~3 min and the emulator needs
    # real time to come up on a shared runner. The first attempt was killed
    # by the cap mid-boot with nothing to show for it.
    max_build_duration: 45
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd android
          bash ../tools/gradle.sh assembleDebug
      - name: Emulator screenshots
        script: bash tools/native_screens.sh android/app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - screens/*.png
      - screens/*.log        # the emulator's own output - the only way to see a failed boot

  ios-simulator:
    name: JobScout iOS (simulator build)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # false on purpose (2026-09-15): with true, ANY newer push on main cancelled
      # the in-flight iOS build — including docs-only pushes that never rebuild
      # it — so two iOS commits in a row went unverified. Android is fast enough
      # to keep cancelling; this one takes 8-10 minutes and has to finish.
      cancel_previous_builds: false
    when:
      changeset:
        includes:
          - 'ios/'
        excludes:
          - '**/*.md'
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Generate Xcode project
        script: |
          cd ios
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        script: |
          # The log is an artifact and the errors are echoed: the API shows no
          # step output, so a compile error would otherwise be invisible.
          cd ios && mkdir -p screens
          set -o pipefail
          xcodebuild build -project JobScout.xcodeproj -scheme JobScout \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee screens/xcodebuild.txt \
            || { echo "==== errors ===="; grep -E "error:|warning: unre" screens/xcodebuild.txt | head -40; exit 65; }
      - name: Simulator screenshot
        script: |
          # Self-diagnosing: everything is logged to an artifact, and the step never
          # hard-fails (the .app artifact still uploads; the log says what broke).
          cd ios && mkdir -p screens
          {
            set -x
            xcrun simctl list devices available | grep -i iphone | head -5
            UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE "[0-9A-F-]{36}")
            echo "UDID=$UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            ls build/Build/Products/Debug-iphonesimulator/
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/JobScout.app
            xcrun simctl launch "$UDID" trade.tbot.jobscout
            sleep 8
            xcrun simctl io "$UDID" screenshot "$PWD/screens/ios-01-candidate.png"   # simctl needs an ABSOLUTE path
            ls -la screens/
          } > screens/log.txt 2>&1 || true
          tail -30 screens/log.txt
    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/*.app
      - ios/screens/*.png
      - ios/screens/*.txt
