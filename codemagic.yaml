# JobScout native builds — Codemagic CI.
# android-debug: installable debug APK (no signing setup needed).
# ios-simulator: proves the SwiftUI app compiles + links; device/TestFlight
#   distribution waits on an Apple Developer account.
#
# AUTO-TRIGGERING (added 2026-09-10). Both build workflows start on a push to
# main, but only when that push touched their own platform — `triggering` picks
# the event, `when.changeset` decides whether it actually runs. The two are
# PARALLEL workflow-level keys; `when` is not nested inside `triggering`.
#
# Why path-scoped: the free plan has finite minutes and mac_mini_m2 is the only
# instance type available, so both workflows queue behind the same machine. A
# site-only or brand-kit commit must not spend a build slot.
#
# Two things that will look like bugs and are not:
#   1. codemagic.yaml is ALWAYS in the changeset, so editing THIS file triggers
#      everything. That is Codemagic's behaviour, not a mistake in the patterns.
#   2. The first push after adding a changeset builds regardless of the
#      condition; filtering starts from the build after that one.
#
# android-screens stays MANUAL on purpose — it boots an emulator and drives the
# whole pipeline for portfolio screenshots, which is far too expensive to run on
# every commit.
workflows:
  android-debug:
    name: JobScout Android (debug APK)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'android/'
        excludes:
          - '**/*.md'
    # mac_mini_m2: the only instance type on the free personal plan (Android SDK preinstalled)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd android
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew --no-daemon assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JobScout-debug.apk
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  # Portfolio screenshots: build, install on an emulator, drive the real
  # pipeline once, capture each stage (tools/native_screens.sh).
  android-screens:
    name: JobScout Android (UI screenshots)
    instance_type: mac_mini_m2
    # 30 was not enough: the APK build alone takes ~3 min and the emulator needs
    # real time to come up on a shared mac runner. The first attempt was killed
    # by the cap mid-boot with nothing to show for it.
    max_build_duration: 45
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd android
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew --no-daemon assembleDebug
      - name: Emulator screenshots
        script: bash tools/native_screens.sh android/app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - screens/*.png
      - screens/*.log        # the emulator's own output - the only way to see a failed boot

  ios-simulator:
    name: JobScout iOS (simulator build)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'ios/'
        excludes:
          - '**/*.md'
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Generate Xcode project
        script: |
          cd ios
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        script: |
          cd ios
          xcodebuild build -project JobScout.xcodeproj -scheme JobScout \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Simulator screenshot
        script: |
          # Self-diagnosing: everything is logged to an artifact, and the step never
          # hard-fails (the .app artifact still uploads; the log says what broke).
          cd ios && mkdir -p screens
          {
            set -x
            xcrun simctl list devices available | grep -i iphone | head -5
            UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE "[0-9A-F-]{36}")
            echo "UDID=$UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            ls build/Build/Products/Debug-iphonesimulator/
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/JobScout.app
            xcrun simctl launch "$UDID" trade.tbot.jobscout
            sleep 8
            xcrun simctl io "$UDID" screenshot "$PWD/screens/ios-01-candidate.png"   # simctl needs an ABSOLUTE path
            ls -la screens/
          } > screens/log.txt 2>&1 || true
          tail -30 screens/log.txt
    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/*.app
      - ios/screens/*.png
      - ios/screens/*.txt
