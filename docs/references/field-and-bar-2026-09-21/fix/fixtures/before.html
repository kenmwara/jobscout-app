<!doctype html><html lang="en" data-market="ca"><head><meta charset="utf-8"><title>before</title>
<link rel="stylesheet" href="../../v3/pack/tokens/tokens.css">
<link rel="stylesheet" href="../../v3/pack/css/base.css">
<link rel="stylesheet" href="../../v3/pack/css/components.css">
<style>
html{color-scheme:dark}
body{margin:0;background:var(--canvas)}
/* FAITHFUL to the shipped mockup: the screen carries the horizontal padding,
   so .phdr sits INSIDE it and its fill is inset by --s4 on each side. */
.screen{position:relative;width:430px;height:520px;overflow:hidden;padding:0 var(--s4);
        background:var(--canvas)}
.screen::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 18% 8%,rgba(72,101,255,.34),transparent 62%),
             radial-gradient(110% 76% at 88% 30%,rgba(140,100,255,.30),transparent 64%)}
.screen>*{position:relative}
.phdr{background:var(--canvas)}           /* <- defect 1 */
.well{display:flex;gap:10px;background:var(--surface);border:1px solid var(--edge-rest);
      border-radius:12px;padding:14px}
textarea.raw{width:100%;height:20px;font-size:13px;line-height:1.5;padding:4px 6px} /* <- defect 2 */
</style></head><body>
<div class="screen">
  <header class="phdr"><button class="chip-btn">← Back</button><span class="phdr__right"><button class="chip-btn">CA</button></span></header>
  <h1 style="font:400 24px/1.2 serif;color:var(--text)">Senior Associate, SLC Accounting</h1>
  <div class="well"><textarea class="raw" placeholder="Paste your résumé"></textarea><button>→</button></div>
</div></body></html>
