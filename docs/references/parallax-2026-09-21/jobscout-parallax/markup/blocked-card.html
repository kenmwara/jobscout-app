<!-- A blocked action carries its own unblock. data-blocked names what is
     missing; the unblock button replaces the primary; the résumé field opens
     in place so the posting is never lost. -->

<article class="prep__card jcard u-surface" data-blocked="resume">
  <h2 class="prep__t">Cover letter</h2>
  <p class="prep__d">A short letter for this posting, grounded in your résumé.</p>

  <div class="prep__a">
    <!-- shown once data-blocked is removed -->
    <button type="button" class="btn btn--primary">Write the letter</button>
    <!-- shown while blocked. It carries btn--primary too: in this state it IS
         the primary action. -->
    <button type="button" class="btn btn--primary btn--unblock">
      Add your résumé <span class="btn__arrow" aria-hidden="true">→</span>
    </button>
  </div>

  <div class="prep__resume">
    <div class="hero__field">
      <input class="hero__input" placeholder="Paste your résumé…" aria-label="Paste your résumé">
      <button type="button" class="hero__clip" aria-label="Attach a file"><!-- clip --></button>
      <button type="button" class="hero__go" aria-label="Save résumé">→</button>
    </div>
    <!-- After the field, never before it. A requirement stated ahead of its
         remedy reads as a refusal. -->
    <p class="prep__resume__note">Saved to your profile, so the next posting scores straight away.</p>
  </div>
</article>

<!-- NOT this. "posting required" is not the reader's problem: if the posting
     is missing, the scorer has nothing to compare, which is a REFUSAL and has
     its own surface (.refusal, neutral rule). Never ask the reader to supply
     something only the system can. -->
