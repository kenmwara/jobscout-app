<!-- ===========================================================================
     JobScout — the card, markup. Stage 1 of docs/BUILD-ORDER.md.

     Two types, ONE skeleton. The only structural difference is whether the
     card carries `data-band` — everything else follows from that:

       swept  (browse, before a resume)   no data-band  → rose unlit, en-dash
                                                          numeral, no band
                                                          pill, no evidence
       scored (matches, saved)            data-band=…   → rose lit to the
                                                          band, score numeral,
                                                          band pill, one
                                                          STRONGEST line

     `data-band` is the switch, not a class, because check_rose.mjs reads it
     as the declared truth and counts the lit dots against it. A class would
     let the two drift.

     Goes into: site/index.html, site/saved.html, mockups/mobile.html, and
     the Android/iOS equivalents. Needs card.css and card.js.
     =========================================================================== -->


<!-- ===========================================================================
     TYPE A — THE SWEPT CARD.  Browse, before a resume exists.

     Eight empty bearings say "there is a score to be had here" without a
     word, on every row of the sweep. When a resume arrives they fill IN
     PLACE: browse becomes matches. This is why the swept card is the scored
     card with its rose unlit, and not a different component.

     Android's sweep card currently offers only an × to dismiss, which is the
     opposite affordance — it invites you to remove the row rather than to
     find out what it is worth.
     =========================================================================== -->

<article class="jcard jcard--swept">

  <div class="jcard__head">

    <!-- 1.2 THE SCORE LEADS: first in reading order, left, numeral centred
         in the rose. It shipped as a bare numeral parked top-right at
         body-text weight — the most important value rendered as the least
         weighted one. The rose is generated by card.js so law 9's geometry
         lives in exactly one place; this is what it produces. -->
    <div class="jcard__score">
      <svg class="rose jcard__rose" viewBox="-4.2416 -3.0639 31.3054 31.3054"
           width="52" height="52" aria-hidden="true" focusable="false"
        ><circle class="dot" data-i="0" style="--dot-i:0" cx="12.000" cy="1.000"  r="2.275"/
        ><circle class="dot" data-i="1" style="--dot-i:1" cx="19.778" cy="4.222"  r="2.569"/
        ><circle class="dot" data-i="2" style="--dot-i:2" cx="23.000" cy="12.000" r="2.864"/
        ><circle class="dot" data-i="3" style="--dot-i:3" cx="19.778" cy="19.778" r="3.158"/
        ><circle class="dot" data-i="4" style="--dot-i:4" cx="12.000" cy="23.000" r="3.453"/
        ><circle class="dot" data-i="5" style="--dot-i:5" cx="4.222"  cy="19.778" r="3.747"/
        ><circle class="dot" data-i="6" style="--dot-i:6" cx="1.000"  cy="12.000" r="4.041"/
        ><circle class="dot" data-i="7" style="--dot-i:7" cx="4.222"  cy="4.222"  r="4.336"/
      ></svg>
      <!-- An en-dash, not "0". A zero is a verdict; this card has none yet. -->
      <span class="jcard__num jcard__num--empty num" aria-hidden="true">–</span>
    </div>

    <div class="jcard__id">
      <p class="jcard__org">
        Shopify <span class="sep">·</span> Remote
      </p>
      <!-- 1.3 Newsreader at 400. The phone shipped this in sans-bold; the
           densest surface in the product was the one breaking law 13. -->
      <h3 class="jcard__title">
        <a class="jcard__link" href="/job/senior-product-designer-shopify">
          Senior Product Designer
        </a>
      </h3>
    </div>

  </div>

  <!-- 1.4 THREE TIERS. A swept card has no verdict, so tier 1 is absent —
       that absence is the information. Tier 2 is a fact in a --sunken
       container with NO hue (law 5); tier 3 has no container at all. -->
  <div class="jcard__meta">
    <span class="jcard__chip">Toronto, ON</span>
    <span class="jcard__when">Posted 2 days ago</span>
  </div>

  <!-- 1.5 THE HEART LEFT THE SCORE'S CORNER. It sat beside the score, so
       saving competed with the verdict. Now it is far right on the action
       row. .jcard__actions is z-index 2, above the stretched link. -->
  <div class="jcard__actions">
    <button type="button" class="btn-1 jcard__btn jcard__btn--primary">
      Score this against me <span class="jcard__arrow" aria-hidden="true">→</span>
    </button>
    <button type="button" class="heart jcard__heart" aria-pressed="false" aria-label="Save">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>
      </svg>
    </button>
  </div>

</article>


<!-- ===========================================================================
     TYPE B — THE SCORED CARD.  Matches and saved.

     Same skeleton. data-band added, rose lit to it, numeral real, band pill
     present, one evidence line.

     THE ONE THING THAT CANNOT DRIFT: the number of dots carrying `is-lit`
     must equal the band.  AUTO 8 · PING 6 · UNSURE 5 · NEAR-MISS 3.
     Set them with card.js's lightRose(), never by hand — check_rose.mjs
     counts them at rendered opacity and compares against data-band.
     =========================================================================== -->

<article class="jcard" data-band="auto">

  <div class="jcard__head">

    <div class="jcard__score">
      <svg class="rose jcard__rose" viewBox="-4.2416 -3.0639 31.3054 31.3054"
           width="52" height="52" aria-hidden="true" focusable="false"
        ><circle class="dot is-lit" data-i="0" style="--dot-i:0" cx="12.000" cy="1.000"  r="2.275"/
        ><circle class="dot is-lit" data-i="1" style="--dot-i:1" cx="19.778" cy="4.222"  r="2.569"/
        ><circle class="dot is-lit" data-i="2" style="--dot-i:2" cx="23.000" cy="12.000" r="2.864"/
        ><circle class="dot is-lit" data-i="3" style="--dot-i:3" cx="19.778" cy="19.778" r="3.158"/
        ><circle class="dot is-lit" data-i="4" style="--dot-i:4" cx="12.000" cy="23.000" r="3.453"/
        ><circle class="dot is-lit" data-i="5" style="--dot-i:5" cx="4.222"  cy="19.778" r="3.747"/
        ><circle class="dot is-lit" data-i="6" style="--dot-i:6" cx="1.000"  cy="12.000" r="4.041"/
        ><circle class="dot is-lit" data-i="7" style="--dot-i:7" cx="4.222"  cy="4.222"  r="4.336"/
      ></svg>
      <!-- The numeral is the accessible voice of the rose; the svg is
           aria-hidden so the score is announced once, not twice. -->
      <span class="jcard__num num" role="img" aria-label="Score 87 out of 100, auto">87</span>
    </div>

    <div class="jcard__id">
      <p class="jcard__org">
        Shopify <span class="sep">·</span> Remote
      </p>
      <h3 class="jcard__title">
        <a class="jcard__link" href="/job/senior-product-designer-shopify">
          Senior Product Designer
        </a>
      </h3>
    </div>

  </div>

  <!-- Three tiers, three distinct treatments. The accept block asserts three
       distinct computed background-colors here: filled · --sunken · none. -->
  <div class="jcard__meta">
    <span class="jcard__band">AUTO</span>
    <span class="jcard__chip">Toronto, ON</span>
    <span class="jcard__when">Posted 2 days ago</span>
  </div>

  <!-- 1.6 ONE EVIDENCE LINE, AND IT IS STRONGEST.
       What-to-answer stays behind the tap. A card that leads with a gap is
       leading with what the reader LACKS, which law 12 forbids. §16 option
       C: a neutral surface with the band colour demoted to a 2px rule,
       because above ~4,000px² a tinted fill stops being a signal and starts
       being decor. -->
  <div class="jcard__evidence">
    <p class="jcard__evidence-k">STRONGEST</p>
    <p>Six years leading design systems work is exactly the systems ownership
       this role is built around.</p>
  </div>

  <div class="jcard__actions">
    <button type="button" class="btn-1 jcard__btn jcard__btn--primary">
      Prepare application <span class="jcard__arrow" aria-hidden="true">→</span>
    </button>
    <button type="button" class="heart jcard__heart" aria-pressed="false" aria-label="Save">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>
      </svg>
    </button>
  </div>

</article>


<!-- ===========================================================================
     NOTES FOR WHOEVER WIRES THIS UP

     1. `.jcard--sm` on the card asks card.js for a 44px rose. The 390pt
        media query in card.css already shrinks the slot; the class is only
        needed where a small card appears on a wide viewport.

     2. The `><circle` line-joining above is not a style choice. Whitespace
        between SVG children is harmless, but the same pattern in the
        .jcard__meta row would put a text node between the pill and the chip
        and defeat `gap`. Keep the habit consistent.

     3. Do not nest anything focusable inside .jcard__id. The stretched link
        (.jcard__link::after) covers the whole card at z-index 1; a second
        link underneath it is unreachable by pointer and confusing by
        keyboard. Anything that must stay clickable goes in .jcard__actions,
        which sits at z-index 2.

     4. The band pill's text is the band, uppercase, no icon. NEAR-MISS reads
        "NEAR MISS" — data-band stays `near`, because the attribute is a key
        and the label is a translation.

     5. THE LEGACY CLASS NAMES STAY. `btn-1` and `heart` sit alongside the
        BEM names because site/app.js and tools/check_motion.mjs both select
        on them. Dropping them is a separate, deliberate migration — not a
        side effect of restyling the card.

     6. TOKEN COLLISION, WATCH FOR IT: demos/rose-demo.html defines
        --lift-hover as a COLOUR, while css/motion.css defines it as the
        -2px displacement. If someone copies the demo's token block next to
        motion.css, the card's hover becomes translateY(#221a52), the whole
        declaration is dropped, and check_motion.mjs fires "hover does not
        displace". The motion.css spelling is the correct one; the demo's
        surface colours are --surface-hover.
     =========================================================================== -->
