# XcodeGen spec — the .xcodeproj is generated in CI (xcodegen generate), never committed.
name: JobScout
options:
  bundleIdPrefix: trade.tbot
  deploymentTarget:
    iOS: "16.0"
targets:
  JobScout:
    type: application
    platform: iOS
    # Resources/ holds the two variable TTFs (google/fonts, OFL) the site embeds and
    # Android bundles; XcodeGen files them under Copy Bundle Resources by extension.
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JobScout
        UILaunchScreen: {}
        UIAppFonts: [newsreader.ttf, inter.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: trade.tbot.jobscout
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
